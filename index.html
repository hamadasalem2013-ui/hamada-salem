<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamada Sobhy Salem — General Accountant & Cost Control Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #070d17;
      --bg-elevated: #0d1726;
      --surface: #122035;
      --surface-hover: #172842;
      --border: rgba(148, 163, 184, 0.14);
      --border-accent: rgba(56, 189, 248, 0.36);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-bright: #7dd3fc;
      --gold: #f59e0b;
      --success: #22c55e;
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.42);
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Arial, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 85% -10%, rgba(56, 189, 248, 0.16), transparent 60%),
        radial-gradient(ellipse 65% 40% at 10% 10%, rgba(245, 158, 11, 0.08), transparent 55%),
        var(--bg-base);
      color: var(--text-main);
      line-height: 1.68;
      min-height: 100vh;
      overflow-x: hidden;
    }

    html[dir="rtl"] body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    .navbar-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(7, 13, 23, 0.82);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #0284c7);
      color: #04101c;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.28);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-link {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--border-accent);
      background: var(--surface-hover);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #0ea5e9);
      color: #05111f;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-bright), var(--primary));
      border-color: transparent;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 68px;
    }

    .hero {
      background: linear-gradient(145deg, rgba(18, 32, 53, 0.94), rgba(13, 23, 38, 0.96));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset-inline-end: -80px;
      top: -80px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
      pointer-events: none;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-accent);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(1.85rem, 3.6vw, 2.65rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .hero-role {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .hero-summary {
      color: var(--text-sub);
      font-size: 0.98rem;
      max-width: 860px;
      margin-bottom: 24px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: rgba(7, 13, 23, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 3px;
    }

    .kpi-label {
      font-size: 0.83rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .contact-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(7, 13, 23, 0.75);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 11px;
      color: var(--text-sub);
      font-size: 0.88rem;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .contact-box a {
      color: inherit;
      text-decoration: none;
      font-weight: 500;
    }

    .contact-box a:hover {
      color: var(--primary);
    }

    .copy-btn {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(56, 189, 248, 0.24);
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      font-size: 1.24rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--primary), var(--gold));
      flex-shrink: 0;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .exp-card {
      background: rgba(7, 13, 23, 0.52);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--primary);
      border-radius: 14px;
      padding: 20px 22px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .exp-card:hover {
      border-color: var(--border-accent);
      border-inline-start-color: var(--primary-bright);
    }

    .exp-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .exp-role {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .exp-period {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.24);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .exp-card ul {
      padding-inline-start: 18px;
      color: var(--text-sub);
      font-size: 0.93rem;
    }

    .exp-card li {
      margin-bottom: 6px;
    }

    .exp-card li:last-child {
      margin-bottom: 0;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 22px;
    }

    .grid-two .section-card {
      margin-bottom: 0;
    }

    .skill-group {
      margin-bottom: 18px;
    }

    .skill-group:last-child {
      margin-bottom: 0;
    }

    .skill-group-title {
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 9px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: rgba(7, 13, 23, 0.65);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meta-item {
      background: rgba(7, 13, 23, 0.52);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .meta-key {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .meta-val {
      font-size: 0.94rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding-top: 8px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 22px;
      background: var(--success);
      color: #042812;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      font-size: 0.88rem;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

      .grid-two {
        grid-template
